name: test

# La batería de regresión del escáner en los tres sistemas operativos, más la validación del CBOM
# contra el esquema oficial publicado, más el consumo de la propia acción por referencia `uses:`
# exactamente como lo hará un desconocido.
#
# Cada caso de test/suite.mjs existe porque un asedio adversarial rompió de verdad esta
# herramienta antes de publicarla. Está escrita en Node y no en Python a propósito:
# windows-latest no trae python3.

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: node test/suite.mjs

  action:
    name: la acción misma, en los tres sistemas
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - id: pqc
        uses: ./
        with:
          path: test/fixtures/vulnerable
          output: out/cbom.json

      - name: Las salidas sirven y el CBOM es real
        shell: bash
        env:
          FINDINGS: ${{ steps.pqc.outputs.findings }}
          CBOM: ${{ steps.pqc.outputs.cbom }}
        run: |
          set -euo pipefail
          echo "findings=$FINDINGS cbom=$CBOM"
          test "$FINDINGS" -gt 0
          test -f "$CBOM"
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.env.CBOM, "utf8"));
            if (c.specVersion !== "1.6") throw new Error("no es CycloneDX 1.6");
            const vuln = c.components.filter(x => (x.properties||[]).some(p => p.name === "fractalai:quantum_vulnerable" && p.value === "true"));
            if (!vuln.some(x => x.name.includes("RSA"))) throw new Error("no encontro RSA");
            for (const x of c.components) for (const p of (x.properties||[]))
              if (p.name === "fractalai:location" && p.value.includes("\\")) throw new Error("separador de Windows en el CBOM");
            console.log("CBOM valido:", vuln.map(x => x.name).join(", "));
          '

      - name: Un repo post-cuántico no debe dar ni un falso positivo
        id: clean
        uses: ./
        with:
          path: test/fixtures/resistant
          output: out/clean.json
      - shell: bash
        env: { FINDINGS: '${{ steps.clean.outputs.findings }}' }
        run: test "$FINDINGS" = "0" || { echo "::error::falso positivo sobre codigo post-cuantico"; exit 1; }

      # El agujero crítico que tuvo esta acción: las entradas se interpolaban dentro del shell del
      # composite, así que un repo que cableara `path` desde el título de un pull request entregaba
      # ejecución de comandos en su propio runner. Esto lo vigila para siempre.
      - name: 'Seguridad: una entrada hostil es dato, no comando'
        continue-on-error: true
        uses: ./
        with:
          path: '$(touch PWNED_RCE; echo hola)'
          output: out/inject.json
      - shell: bash
        run: |
          set -euo pipefail
          test ! -e PWNED_RCE || { echo "::error::INYECCION DE COMANDOS"; exit 1; }
          echo "la entrada hostil se trato como ruta literal"

      # El trinquete de punta a punta A TRAVES de la accion: congelar, no empeorar, empeorar.
      - name: 'Trinquete: congelar la linea base'
        uses: ./
        with:
          path: test/fixtures/vulnerable
          output: out/rb.json
          baseline: out/baseline.json
          write-baseline: 'true'
          sarif: ''

      - name: 'Trinquete: sin cambios no debe cortar'
        id: same
        uses: ./
        with:
          path: test/fixtures/vulnerable
          output: out/rb.json
          baseline: out/baseline.json
          fail-on-increase: 'true'
          sarif: ''

      - name: 'Trinquete: anadir criptografia nueva SI debe cortar'
        id: worse
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/ratchet && cp -r test/fixtures/vulnerable/* /tmp/ratchet/
          printf 'const k = crypto.createECDH("prime256v1");\n' > /tmp/ratchet/added.js
          node scan.mjs --path=/tmp/ratchet --output=out/rb2.json --baseline=out/baseline.json --fail-on-increase=true
          echo "no_corto=si" >> "$GITHUB_OUTPUT"

      - name: 'Trinquete: y su corte es observable'
        shell: bash
        env:
          OUTCOME: ${{ steps.worse.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure" || { echo "::error::el trinquete no corto al anadir criptografia"; exit 1; }
          echo "el trinquete corta al empeorar"

      - name: 'El informe legible se escribe y lleva sus propios limites'
        uses: ./
        with:
          path: test/fixtures/vulnerable
          output: out/rep.json
          report: out/PQC-REPORT.md
          sarif: ''
      - shell: bash
        run: |
          set -euo pipefail
          test -s out/PQC-REPORT.md
          grep -q "not a proof of absence" out/PQC-REPORT.md
          grep -q "not a compliance certification" out/PQC-REPORT.md
          echo "el informe lleva sus limites"

      - name: 'Puerta de corte: fail-on-findings debe fallar el pase'
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: test/fixtures/vulnerable
          output: out/gate.json
          fail-on-findings: 'true'
      - shell: bash
        env: { OUTCOME: '${{ steps.gate.outcome }}' }
        run: test "$OUTCOME" = "failure" || { echo "::error::la puerta de corte no corto el pase"; exit 1; }

  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generar tres CBOM distintos
        run: |
          set -euo pipefail
          node scan.mjs --path=test/fixtures/vulnerable --output=cbom-vuln.json
          node scan.mjs --path=test/fixtures/resistant  --output=cbom-clean.json
          node scan.mjs --path=.                        --output=cbom-self.json

      - name: Generar tambien el SARIF y el informe
        run: |
          set -euo pipefail
          node scan.mjs --path=test/fixtures/vulnerable --output=sv.json --sarif=sv.sarif --report=sv.md
          test -s sv.sarif
          test -s sv.md

      # El README afirma "SARIF 2.1.0". Esa frase se comprueba contra el esquema publicado, no de
      # palabra: lo va a ingerir GitHub, y un SARIF invalido se rechaza entero sin decir por que.
      - name: Validar el SARIF contra el esquema oficial 2.1.0
        run: |
          set -euo pipefail
          curl -sSfL -o sarif-schema.json https://json.schemastore.org/sarif-2.1.0.json
          python3 -m pip install --quiet jsonschema rfc3339-validator
          python3 - <<'PY'
          import json, sys, jsonschema
          V = jsonschema.Draft7Validator(json.load(open('sarif-schema.json')),
                                         format_checker=jsonschema.FormatChecker())
          doc = json.load(open('sv.sarif'))
          errs = sorted(V.iter_errors(doc), key=lambda e: list(e.path))
          if errs:
              print(f'::error::el SARIF no valida ({len(errs)} error(es))')
              for e in errs[:8]:
                  print('   ', list(e.path), e.message[:200])
              sys.exit(1)
          run0 = doc['runs'][0]
          # Ninguna regla puede salir como `error`: un error en Code Scanning bloquea revisiones, y
          # esto es un inventario, no una vulnerabilidad explotable hoy.
          for r in run0['tool']['driver']['rules']:
              assert r['defaultConfiguration']['level'] != 'error', r['id'] + ' sale como error'
              assert r['properties']['security-severity'], r['id'] + ' sin security-severity'
          print('SARIF valido, reglas:', len(run0['tool']['driver']['rules']), 'resultados:', len(run0['results']))
          PY

      - name: Validar contra el esquema oficial de CycloneDX 1.6
        run: |
          set -euo pipefail
          curl -sSfL -o bom-1.6.schema.json https://raw.githubusercontent.com/CycloneDX/specification/master/schema/bom-1.6.schema.json
          python3 -m pip install --quiet jsonschema rfc3339-validator
          python3 - <<'PY'
          import json, sys, jsonschema
          schema = json.load(open('bom-1.6.schema.json'))
          # El comprobador de formatos NO trae date-time por defecto: sin rfc3339-validator el
          # formato del timestamp se omite en silencio y la validacion pasa sin validar eso.
          fc = jsonschema.FormatChecker()
          assert 'date-time' in fc.checkers, 'date-time no registrado: la validacion seria incompleta'
          V = jsonschema.Draft7Validator(schema, format_checker=fc)
          bad = False
          for f in ('cbom-vuln.json', 'cbom-clean.json', 'cbom-self.json'):
              errs = sorted(V.iter_errors(json.load(open(f))), key=lambda e: list(e.path))
              if errs:
                  bad = True
                  print(f'::error::{f} no valida contra CycloneDX 1.6 ({len(errs)} error(es))')
                  for e in errs[:8]:
                      print('   ', list(e.path), e.message[:200])
              else:
                  print(f'{f}: valida contra CycloneDX 1.6')
          sys.exit(1 if bad else 0)
          PY

  # La prueba definitiva de adopción: consumir la referencia PUBLICADA, resuelta por GitHub desde la
  # etiqueta, exactamente la línea que está en el README. Los trabajos de arriba usan ./, que prueba
  # el código pero no prueba que la línea del README funcione — eso depende de que la etiqueta exista
  # y de que GitHub la resuelva. En el repositorio anterior esa línea estaba ROTA (la etiqueta no
  # contenía la acción), así que aquí se vigila.
  stranger:
    name: la línea del README, tal cual
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: pqc
        uses: johnInarti/pqc-readiness-action@v1
        with:
          path: test/fixtures/vulnerable
          output: cbom-published.json
      - shell: bash
        env:
          FINDINGS: ${{ steps.pqc.outputs.findings }}
          CBOM: ${{ steps.pqc.outputs.cbom }}
        run: |
          set -euo pipefail
          echo "findings=$FINDINGS cbom=$CBOM"
          test "$FINDINGS" -gt 0
          test -f "$CBOM"
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.env.CBOM, "utf8"));
            if (c.specVersion !== "1.6") throw new Error("no es CycloneDX 1.6");
            const v = c.components.filter(x => (x.properties||[]).some(p => p.name === "fractalai:quantum_vulnerable" && p.value === "true"));
            if (!v.some(x => x.name.includes("RSA"))) throw new Error("no encontro RSA");
            console.log("la referencia publicada funciona:", v.map(x => x.name).join(", "));
          '

  # La integracion con la interfaz de GitHub: subir el SARIF a code scanning y dejar el comentario.
  # Se prueba en un pull request real porque es donde vive, y con los permisos concedidos, que es la
  # unica forma de saber que el camino feliz funciona y no solo el degradado.
  integration:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - id: pqc
        uses: ./
        with:
          path: test/fixtures/vulnerable
          output: cbom.json
          sarif: pqc.sarif
          upload-sarif: 'true'
          comment-on-pr: 'true'
          report: PQC-REPORT.md
      - shell: bash
        env:
          SARIF: ${{ steps.pqc.outputs.sarif }}
        run: |
          set -euo pipefail
          test -s "$SARIF"
          test -s PQC-REPORT.md
          echo "sarif=$SARIF y el informe se escribieron; la subida y el comentario quedan en el log de arriba"
